
    <main class="registro-page">
      <a routerLink="/crear-cuenta" class="back-btn" aria-label="Volver">
        <img src="/icons/flecha-volver.png" alt="Volver" />
      </a>

      <section class="registro-container">
        <h1>Registro de ciudadano</h1>

        <div class="steps">
          <div class="step completed">
            <span>1</span>
            <p>Tipo de usuario</p>
          </div>

          <div class="line"></div>

          <div class="step active">
            <span>2</span>
            <p>Datos principales</p>
          </div>

          <div class="line"></div>

          <div class="step">
            <span>3</span>
            <p>Confirmación</p>
          </div>
        </div>

        <section class="form-card">
          <h2>Datos principales</h2>

          <form
            class="registro-form"
            id="formRegistroCiudadano"
           (ngSubmit)="submit()">
<app-alerta [mensaje]="error" tipo="error" />
            <div class="form-group">
              <label for="dni">DNI</label>
              <div class="input-box" id="boxDni">
                <img src="/icons/dni.png" alt="DNI" class="input-icon" />

                <input
                  type="text"
                  id="dni"
                  inputmode="numeric"
                  maxlength="8"
                  placeholder="Ingresa tu número de DNI"
                 name="dni" [(ngModel)]="datos.dni" >

                <img
                  src="/icons/jam_alert-f.png"
                  alt="Error"
                  class="input-error-img"
                  id="errorDniIcon"
                />
              </div>
            </div>
              
            <div class="form-group">
              <label for="correo">Correo electrónico</label>

              <div class="input-box">
                <img src="/icons/email2.png" alt="Correo" class="input-icon" />
                <input
                  type="email"
                  id="correo"
                  placeholder="ejemplo@correo.com"
                 name="correo" [(ngModel)]="datos.correo" >
              </div>
            </div>

            <div class="form-group">
              <label for="distrito">Distrito</label>

              <div class="input-box">
                <img src="/icons/map2.png" alt="Distrito" class="input-icon" />
                <input
                  type="text"
                  id="distrito"
                  placeholder="Ej: Lima metropolitana, Cuzco..."
                 name="distrito" [(ngModel)]="datos.distrito" >
              </div>
            </div>

            <div class="form-group">
              <label for="telefono">
                Teléfono <span>(opcional)</span>
              </label>

              <div class="input-box">
                <img src="/icons/llamar2.png" alt="Teléfono" class="input-icon" />
                <input
                  type="tel"
                  id="telefono"
                  placeholder="Ingresa tu número de teléfono"
                 name="telefono" [(ngModel)]="datos.telefono" >
              </div>
            </div>

            <button type="submit" class="btn-continuar">
              Continuar
              <img src="/icons/huella.png" alt="Continuar" />
            </button>
          </form>
        </section>
      </section>
    </main>

<footer class="footer-compacto">
  <div class="footer-compacto-container">
    <div class="footer-compacto-brand">
      <img src="/img/logo-blanco.png" alt="Logo Huellas de Auxilio">
      <p>© 2026 Huellas de Auxilio. Todos<br>los derechos reservados.</p>
    </div>
    <div class="footer-compacto-links">
      <a href="/ayuda">Soporte</a>
      <a href="/documentos/politica-privacidad.pdf" target="_blank" rel="noopener noreferrer">Política de Privacidad</a>
      <a href="/documentos/terminos-condiciones.pdf" target="_blank" rel="noopener noreferrer">Términos y condiciones</a>
    </div>
    <div class="footer-social">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="/icons/facebook.png" alt=""></a>
      <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X"><img src="/icons/x.png" alt=""></a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="/icons/instagram.png" alt=""></a>
    </div>
  </div>
</footer>
